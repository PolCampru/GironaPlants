# Hardening shared by the three Node apps, added after the 2026-10-12 incident
# (an RCE in Next.js dropped a scanner binary into gp-frontend's /tmp and ran
# it as `node`). /tmp is noexec so a dropped ELF cannot be started, no process
# can gain privileges, all Linux capabilities are dropped, and the CPU/PID caps
# stop a miner or scanner from saturating the box before anyone notices.
x-node-hardening: &node-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  pids_limit: 512
  cpus: "1.5"

services:
  caddy:
    image: caddy:2-alpine
    container_name: gp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  strapi:
    <<: *node-hardening
    build:
      context: ./strapi
    container_name: gp-strapi
    ports:
      - "127.0.0.1:1337:1337"
    restart: unless-stopped
    env_file: ./strapi/.env
    volumes:
      - ./data:/srv/app/data
      - ./uploads:/srv/app/public/uploads
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=256m
    networks: [web]

  frontend:
    <<: *node-hardening
    build:
      context: ./frontend
      network: host
      args:
        NEXT_PUBLIC_BASE_URL: "https://gironaplants.com"
        STRAPI_BASE_URL: "http://127.0.0.1:1337"
        STRAPI_TOKEN: "${STRAPI_TOKEN}"
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID}"
    container_name: gp-frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    # Read-only root: the only writable paths are these noexec tmpfs mounts.
    # .next/cache is seeded from .next/cache-seed at start (see Dockerfile).
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
      - /home/node:noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
      - /srv/app/.next/cache:noexec,nosuid,nodev,size=768m,uid=1000,gid=1000
    networks: [web]

  # --- Analitica (Umami) -------------------------------------------------
  # Cookieless: no identifica al visitante ni guarda datos personales, asi
  # que no necesita el consentimiento del banner de cookies.
  umami-db:
    image: postgres:16-alpine
    container_name: gp-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: "${UMAMI_DB_PASSWORD}"
    volumes:
      - umami_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [web]

  # BASE_PATH hace que Umami se sirva bajo /stats; el Caddyfile le pasa el
  # prefijo tal cual. Servirlo en el dominio principal (y no en un subdominio)
  # evita depender de un registro DNS nuevo en PIMEC y esquiva los bloqueadores
  # de anuncios, que filtran por hostname de analitica.
  umami:
    <<: *node-hardening
    # Construida desde fuente, no `image:`, porque BASE_PATH es un ARG de
    # build: Next.js compila `basePath` dentro del bundle, asi que ninguna
    # imagen publicada puede servirse bajo /stats. Las imagenes oficiales
    # devuelven 404 en todo el prefijo (probado con postgresql-latest, que ya
    # es v3, y con v2.19.0).
    #
    # El contexto es un clon del repo de Umami que vive solo en el VPS, igual
    # que ./frontend y ./strapi — ver deploy/README.md. Esta en el tag v2.20.2
    # con `next` fijado a 15.5.28 en package.json (v2.20.2 trae ^15.5.9, aun
    # vulnerable a la RCE del optimizador de imagenes).
    build:
      context: ./umami-src
      args:
        DATABASE_TYPE: postgresql
        BASE_PATH: /stats
    image: gironaplants/umami:2.20.2-stats
    container_name: gp-umami
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: "postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami"
      APP_SECRET: "${UMAMI_APP_SECRET}"
      BASE_PATH: /stats
      DISABLE_TELEMETRY: "1"
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    networks: [web]

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  umami_db:
